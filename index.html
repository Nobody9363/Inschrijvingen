<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Ticket Kopen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f5f5f5;
    }
    form {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
    }
    input, select, button {
      display: block;
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.5rem;
    }
    label {
      margin-bottom: 0.3rem;
      display: block;
    }
  </style>
</head>
<body>

  <form action="https://formspree.io/f/meokvdvo" method="POST">
    <h2>Ticket Kopen</h2>

    <label for="ticket">Kies een ticket:</label>
    <select id="ticket" name="Ticket type" required>
      <option value="Standaard">Standaard</option>
      <option value="Exclusive">Exclusive</option>
      <option value="Premium">Premium</option>
    </select>

    <label for="email1">E-mail:</label>
    <input type="email" id="email1" name="Email" required>

    <label for="email2">Bevestig e-mail:</label>
    <input type="email" id="email2" name="Email bevestiging" required>

    <label for="password">Wachtwoord:</label>
    <input type="password" id="password" name="Wachtwoord" required>

    <label for="voornaam">Voornaam:</label>
    <input type="text" id="voornaam" name="Voornaam" required>

    <label for="achternaam">Achternaam:</label>
    <input type="text" id="achternaam" name="Achternaam" required>

    <label for="leeftijd">Leeftijd:</label>
    <input type="number" id="leeftijd" name="Leeftijd" min="0" required>

    <!-- Verborgen velden voor instellingen -->
    <input type="hidden" name="_subject" value="Nieuwe Ticket Aankoop!">
    <input type="hidden" name="_cc" value="dereyckjasper@telenet.be">
    <input type="hidden" name="_captcha" value="false">

    <button type="submit">Kopen</button>
  </form>

  <script>
    // E-mail validatie
    document.querySelector("form").addEventListener("submit", function(e) {
      const email1 = document.getElementById("email1").value;
      const email2 = document.getElementById("email2").value;
      if (email1 !== email2) {
        alert("De twee e-mailadressen komen niet overeen.");
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
